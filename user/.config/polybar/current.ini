;; Global WM Settings

[global/wm]
margin-bottom = 0
margin-top = 0

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; File Inclusion

include-file = ~/.config/polybar/colors.ini

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; Bar Settings

[bar/main]
monitor =
monitor-fallback =
monitor-strict = false

bottom = false
fixed-center = true

width = 100%
height = 26
offset-x = 0%
offset-y = 15

background = #00000000
foreground = ${color.fg}

radius-top = 5
radius-bottom = 5

line-size = 0
border-bottom-size = 0
border-color = ${color.ac}

padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1

font-0 = "Hack Nerd Font:style=Bold:size=10;2.5"
font-1 = "AtkynsonMono Nerd Font:size=8;2"
font-2 = "Hack Nerd Font Mono:size=10;2"
font-4 = "Hack Nerd Font Mono:style=Bold:size=15;3"
# font-0 = "Iosevka Nerd Font:size=13;3"
# font-1 = "Iosevka Nerd Font:bold:size=24;2"
# font-2 = "Iosevka Nerd Font:size=22;6"
# font-3 = "Source Code Pro:size=10;3"
# font-4 = "Montserrat Medium:style=Medium:size=12;3"
# font-5 = "Helvetica Rounded:style=Bold:size=10.5;3"
# font-6 = "Hurmit Nerd Font Mono:style=medium:pixelsize=17;3"

separator =
dim-value = 1.0
wm-name = polybar
locale =
tray-position = none
wm-restack = bspwm
enable-ipc = true

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; Primary bar
;; Left: Kali | time | local IP | VPN IP
;; Center: bspwm workspaces
;; Right: custom apps | volume | network | power-status | power menu

[bar/left]
inherit = bar/main
width = 300
offset-x = 1%
radius-top = 10
radius-bottom = 10
modules-left = kali date volume
modules-center =
modules-right =
# background = ${color.island-bg}

[bar/center]
inherit = bar/main
width = 25%
offset-x = 37.5%
radius-top = 10
radius-bottom = 10
modules-left =
modules-center = local_ip bspwm vpn_ip
modules-right =
# background = ${color.island-bg}

[bar/right]
inherit = bar/main
width = 25%
offset-x = 74%
radius-top = 10
radius-bottom = 10
modules-left =
modules-center =
modules-right = kitty spotify browser files settings separator power-status power
# background = ${color.island-bg}

;; These bars are not launched by launch.sh unless you explicitly add them.

[bar/secondary]
inherit = bar/main
width = 7%
height = 40
offset-x = 3.8%
offset-y = 15
modules-center = date

[bar/log]
inherit = bar/main
width = 2.5%
height = 40
offset-x = 1%
offset-y = 15
modules-center = my-text-label

[bar/top]
inherit = bar/main
width = 6%
height = 40
offset-x = 90.5%
offset-y = 15
modules-center = volume network power

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; Application Settings

[settings]
screenchange-reload = false

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

; Do not leave these blank: newer Polybar versions try to parse them as numbers.
format-spacing = 0
format-padding = 0
format-margin = 0
format-offset = 0

pseudo-transparency = false

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;;
;;	   __  ___          __      __
;;	  /  |/  /___  ____/ /_  __/ /__  _____
;;	 / /|_/ / __ \/ __  / / / / / _ \/ ___/
;;	/ /  / / /_/ / /_/ / /_/ / /  __(__  )
;;	/_/  /_/\____/\__,_/\__,_/_/\___/____/
;;
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; Left modules

[module/kali]
type = custom/text
; Text fallback is intentional because the Kali Nerd Font glyph was not
; available in the currently loaded font set.
format = "%{T5}%{T-} "
format-padding = 0
click-left = rofi -show drun
format-foreground = ${color.fg}

[module/date]
type = custom/script
exec = date '+ %I:%M:%S %p'
interval = 1
label = %output%
label-padding = 0
click-left = /usr/bin/gnome-calendar
format-foreground = ${color.fg}

[module/local_ip]
type = custom/script
exec = ip route get 1.1.1.1 | awk '{print $7; exit}'
interval = 5
format-prefix = ""
label = %output%
format-foreground = ${color.fg}

[module/vpn_ip]
type = custom/script
exec = ~/.config/polybar/scripts/vpn-ip.sh
interval = 3
format-prefix = ""
label = %output%
format-foreground = ${color.fg}

;;Center module

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-click = true
enable-scroll = true

# format-background = #00000000

label-focused = ●
label-focused-foreground = ${color.green}
# label-focused-background = #00000000
label-focused-padding = 1

label-occupied = ●
label-occupied-foreground = ${color.black}
# label-occupied-background = #00000000
label-occupied-padding = 1

label-empty = ●
label-empty-foreground = ${color.black}
# label-empty-background = #00000000
label-empty-padding = 1

label-urgent = ●
label-urgent-foreground = ${color.red}
# label-urgent-background = #00000000
label-urgent-padding = 1

;; Right-side application launchers

[module/kitty]
type = custom/text
format = 
format-padding = 1
click-left = kitty &
format-foreground = ${color.fg}

[module/browser]
type = custom/text
format = 
format-padding = 1
click-left = firefox-esr &
format-foreground = ${color.fg}

[module/files]
type = custom/text
format = 
format-padding = 1
click-left = thunar &
format-foreground = ${color.fg}

[module/spotify]
type = custom/text
format = 
format-padding = 1
click-left = spotify &
format-foreground = ${color.fg}

;; Sound

[module/volume]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-foreground = ${color.fg}

format-volume = <label-volume>
label-volume = "  %percentage%%"
label-volume-padding = 0
label-volume-foreground = ${color.fg}

format-muted = <label-muted>
label-muted =  muted
label-muted-padding = 1
label-muted-foreground = ${color.fg}

click-right = pavucontrol &

;; Network
;; VMware exposes the guest NIC as eth0, so this intentionally shows
;; a network/Wi-Fi-style icon without trying to print an ESSID.

[module/settings]
type = custom/text
format = "%{T8}%{T-}"
format-padding = 1
click-left = xfce4-settings-manager &
format-foreground = ${color.fg}

[module/network]
type = internal/network
interface = eth0
interval = 3
accumulate-stats = true
unknown-as-up = true
format-foreground = ${color.fg}

format-volume = <label-volume>
label-volume =  %percentage%%
label-volume-padding = 1

format-muted = <label-muted>
label-muted =  muted
label-muted-padding = 1

click-right = pavucontrol &

;; Network
;; VMware exposes the guest NIC as eth0, so this intentionally shows
;; a network/Wi-Fi-style icon without trying to print an ESSID.



;; "Power supply" indicator.
;; A real battery module is intentionally not used because VMware does not
;; expose a usable BAT*/capacity interface in this VM.
[module/separator]
type = custom/text
format = "│"
format-foreground = ${color.gray}
format-padding = 1

[module/power-status]
type = custom/text
format = "%{T4}%{T-}"
format-padding = 1
format-foreground = ${color.fg}

;; Power menu

[module/power]
type = custom/text
format = 
format-padding = 1
click-left = ~/.config/polybar/scripts/powermenu_alt &
format-foreground = ${color.fg}

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; Compatibility / original auxiliary modules
;; Kept so the old bar sections and scripts can still be reused.

[module/my-text-label]
type = custom/text
format = K

[module/mpd]
type = internal/mpd
interval = 2
format-online = <label-song>
format-online-foreground = ${color.fg}
label-song = "%title%"
label-song-maxlen = 12
label-song-ellipsis = true
label-offline = "Offline"

[module/term]
type = custom/text
format = 
click-left = kitty &
format-foreground = ${color.fg}

[module/web]
type = custom/text
format = 
click-left = firefox-esr &
format-foreground = ${color.fg}

[module/edit]
type = custom/text
format = 
click-left = geany &
format-foreground = ${color.fg}

[module/apps]
type = custom/text
format = 
click-left = ~/.config/polybar/scripts/launcher &
format-foreground = ${color.fg}

[module/sep]
type = custom/text
format = " | "
format-foreground = ${color.gray}

[module/sep2]
type = custom/text
format = "   "

[module/alsa]
type = internal/alsa
format-volume = <label-volume>
format-muted = <label-muted>
label-volume =  %percentage%%
label-muted =  muted
click-right = pavucontrol &
format-foreground = ${color.fg}

[module/sysmenu]
type = custom/text
format = 
click-left = ~/.config/polybar/scripts/powermenu_alt &
format-foreground = ${color.fg}

