enable_audio_bell no

include color.ini
include ~/.cache/wal/colors-kitty.conf

allow_remote_control yes

font_family AtkynsonMono Nerd Font
font_size 11

disable_ligatures never

url_color #61afef

url_style curly

#map ctrl+left neighboring_window left
#map ctrl+right neighboring_window right
#map ctrl+up neighboring_window up
#map ctrl+down neighboring_window down

# Shift + flechas -> selección carácter a carácter
map shift+left send_text all \x1b[1;2D
map shift+right send_text all \x1b[1;2C

# Ctrl + Shift + flechas -> selección palabra a palabra
map ctrl+shift+left send_text all \x1b[1;6D
map ctrl+shift+right send_text all \x1b[1;6C


copy_on_select clipboard
mouse_map right click ungrabbed paste_from_clipboard

map f1 copy_to_buffer a
map f2 paste_from_buffer a
map f3 copy_to_buffer b
map f4 paste_from_buffer b

cursor_shape beam
cursor_beam_thickness 1.8

mouse_hide_wait 3.0
detect_urls yes

repaint_delay 5
input_delay 0
sync_to_monitor yes

map ctrl+shift+z toggle_layout stack
tab_bar_style powerline

inactive_tab_background #e06c75
active_tab_background #98c379
inactive_tab_foreground #000000
tab_bar_margin_color black

map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd

background_opacity 0.60

window_padding_width 10
window_margin_width 0
window_border_width 1

active_border_color #7aa2f7
inactive_border_color #2a2e3a

shell zsh
